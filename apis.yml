aid: lumeon
name: Lumeon
description: >-
  Lumeon is a clinical automation and care orchestration platform that uses
  intelligent automation and real-time data integration to remove inefficiencies
  from care-coordination processes. It lets health systems scale best-practice
  care pathways across the enterprise so clinicians can focus on patients while
  operational cost falls and outcomes improve. Lumeon serves 70+ health systems
  globally — including Optum, NYC Health+Hospitals, and the NHS — and is now part
  of Health Catalyst. No public developer API, OpenAPI, or SDK surface is
  published; this profile captures the company identity and its security and
  compliance posture.
